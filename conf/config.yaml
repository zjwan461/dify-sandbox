app:
  port: 8194
  debug: True
  key: dify-sandbox
max_workers: 4
max_requests: 50
worker_timeout: 5
python_path: /opt/python/bin/python3
enable_network: True # please make sure there is no network risk in your environment
enable_preload: False # please keep it as False for security purposes
log_path: "./logs" # path to store log files, default is "./logs"
upload_dir: "/data/uploads" # path to store uploaded files, default is "./uploads"
allowed_syscalls: # please leave it empty if you have no idea how seccomp works
proxy:
  socks5: ''
  http: ''
  https: ''
  no_proxy: ''
allowed_env_vars: [] # list of environment variable names to propagate from the container to the script execution environment
# Extra command basenames to block for the /v1/sandbox/run/command endpoint.
# Merged with a built-in deny-list of dangerous commands (shells, rm, sudo,
# package managers, ...). You can only widen the deny-list here, never shrink it.
blocked_commands: []
